[package]
name = "application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain = { workspace = true }
api = { workspace = true }
weebo-kit-application = { workspace = true }
weebo-kit-api = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# The objects of an instance (k8s-openapi types, no client), its rendered
# configuration, parsed and checked by Notify's own model.
k8s-openapi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
notify-config = { workspace = true }

[dev-dependencies]
kube = { workspace = true }
tokio = { workspace = true }
weebo-kit-application = { workspace = true, features = ["test-support"] }

[features]
# Exposes `test_support` (the kit's in-memory owned objects, fake
# credentials and directories) to other crates' tests.
test-support = ["weebo-kit-application/test-support"]

[lints]
workspace = true
